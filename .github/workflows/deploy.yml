name: Deploy Render

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  trigger:
    runs-on: ubuntu-latest
    steps:
      - name: Avvia deploy Render
        env:
          HOOK: ${{ secrets.RENDER_DEPLOY_HOOK }}
        run: |
          if [ -z "$HOOK" ]; then
            echo "Nessun RENDER_DEPLOY_HOOK. Render deve avere Auto-Deploy On Commit attivo."
            echo "Dashboard: Settings del servizio mizzli-fc > Auto-Deploy = On Commit"
            exit 0
          fi
          curl -fsS -X POST "$HOOK"
          echo "Deploy avviato"
